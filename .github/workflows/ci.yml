name: PQCShield CI

on:
  push:
    branches:
      - main
      - review-devops
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate PQCShield
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install liboqs build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            git \
            ninja-build \
            pkg-config \
            libssl-dev

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python3 -m compileall -q .

      - name: Run real ML-KEM self-test
        run: python3 -m collector.benchmark

      - name: Run small real localization sample
        run: |
          python3 - <<'PY'
          from analyzer.localization import localize

          localize(sample_count=10)
          PY

      - name: Verify localization report
        run: test -s reports/localization_report.csv

      - name: Build Docker image
        run: docker build -t pqcshield:ci .
